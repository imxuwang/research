<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --seg-bg: #e2e8f0;
      --seg-active: #ffffff;
      --border: #e2e8f0;
      --border-hover: #0284c7;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #080d18;
        --card: #11192c;
        --seg-bg: #0d1424;
        --seg-active: #1e293b;
        --border: rgba(148, 163, 184, 0.18);
        --border-hover: #38bdf8;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
    }
    .lang-switch {
      display: inline-flex;
      background: var(--seg-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
      flex-shrink: 0;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: color 0.12s, background 0.12s;
    }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.active {
      background: var(--seg-active);
      color: var(--accent);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.10);
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.item:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }
    .item-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .item-desc {
      margin: 0;
      font-size: 13.5px;
      color: var(--muted);
    }
    .arrow {
      color: var(--accent);
      font-size: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main>
    <div class="top-bar">
      <div>
        <h1 data-i18n="site_title">Research</h1>
        <p class="subtitle" data-i18n="site_subtitle">Interactive tools, simulations, and notes.</p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en-UK">EN</button>
        <button type="button" class="lang-btn" data-lang="zh-CN">中文</button>
      </div>
    </div>

    <div class="list">
      <a class="item" href="./retirement-simulation/">
        <div>
          <div class="item-title" data-i18n="ret_sim_title">Retirement Simulation</div>
          <p class="item-desc" data-i18n="ret_sim_desc">Sequential &amp; 1,000-run Monte Carlo portfolio simulation using historical equity, bond, and US CPI data (1928–2025).</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </main>

  <script>
    const LANG_STORAGE_KEY = "site_lang_v1";
    const SETTINGS_STORAGE_KEY = "retirement_sim_settings_v1";

    // Translation dictionary: key -> { languageCode: text }
    const I18N = {
      site_title: {
        "en-UK": "Research",
        "zh-CN": "研究与工具"
      },
      site_subtitle: {
        "en-UK": "Interactive tools, simulations, and notes.",
        "zh-CN": "交互式工具、模拟分析与笔记。"
      },
      ret_sim_title: {
        "en-UK": "Retirement Simulation",
        "zh-CN": "退休资产模拟"
      },
      ret_sim_desc: {
        "en-UK": "Sequential & 1,000-run Monte Carlo portfolio simulation using historical equity, bond, and US CPI data (1928–2025).",
        "zh-CN": "基于 1928–2025 年历史股票、债券及美国 CPI 数据的顺序回测与 1,000 次随机蒙特卡洛模拟。"
      }
    };

    function detectInitialLang() {
      try {
        const saved = localStorage.getItem(LANG_STORAGE_KEY);
        if (saved === "en-UK" || saved === "zh-CN") return saved;
        const simRaw = localStorage.getItem(SETTINGS_STORAGE_KEY);
        if (simRaw) {
          const parsed = JSON.parse(simRaw);
          if (parsed && (parsed.lang === "en-UK" || parsed.lang === "zh-CN")) return parsed.lang;
        }
      } catch (_) {}
      const nav = (navigator.language || "").toLowerCase();
      return nav.startsWith("zh") ? "zh-CN" : "en-UK";
    }

    let currentLang = detectInitialLang();

    function t(key) {
      const entry = I18N[key];
      if (!entry) return key;
      return entry[currentLang] !== undefined ? entry[currentLang] : entry["en-UK"];
    }

    function applyLang(lang) {
      currentLang = lang === "zh-CN" ? "zh-CN" : "en-UK";
      document.documentElement.lang = currentLang === "zh-CN" ? "zh-CN" : "en-GB";
      document.title = t("site_title");
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === currentLang);
      });
      try {
        localStorage.setItem(LANG_STORAGE_KEY, currentLang);
        const simRaw = localStorage.getItem(SETTINGS_STORAGE_KEY);
        if (simRaw) {
          const parsed = JSON.parse(simRaw);
          if (parsed && typeof parsed === "object") {
            parsed.lang = currentLang;
            localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(parsed));
          }
        }
      } catch (_) {}
    }

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => applyLang(btn.dataset.lang));
    });

    applyLang(currentLang);
  </script>
</body>
</html>
