<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --border-hover: #0284c7;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #080d18;
        --card: #11192c;
        --border: rgba(148, 163, 184, 0.18);
        --border-hover: #38bdf8;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 14.5px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.item:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }
    .item-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .item-desc {
      margin: 0;
      font-size: 13.5px;
      color: var(--muted);
    }
    .arrow {
      color: var(--accent);
      font-size: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Research</h1>
    <p class="subtitle">Interactive tools, simulations, and notes.</p>

    <div class="list">
      <a class="item" href="./retirement-simulation/">
        <div>
          <div class="item-title">Retirement Simulation</div>
          <p class="item-desc">Sequential &amp; 1,000-run Monte Carlo portfolio simulation using historical equity, bond, and US CPI data (1928–2025).</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </main>
</body>
</html>
